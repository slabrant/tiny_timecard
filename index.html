<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tiny Timecard</title>
        <script src="js.js" defer></script>
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <button id="backDayButton" title="Previous Day"><</button>
        <input id="dateInput" type="date">
        <button id="nextDayButton" title="Next Day">></button>
        <button id="addButton" title="Add Row">+</button>
        <button id="saveButton" title="Save All">Save</button>
        <button id="downloadButton" title="Download as CSV">Download</button>
        <label for="uploadButton" title="Upload as CSV" class="buttonLabel">Upload</label>
        <input type="file" id="uploadButton" accept=".csv" hidden>
        <label class="buttonLabel">
            Pomodoro
            <input type="checkbox" id="pomodoroInput">
        </label>
        <button id="settingsButton" title="Settings">...</button>
        <div id="settings" hidden>
            <label class="setting">
                <span class="settingTitle">Pomodoro cycle:</span>
                <input id="pomodoroTimesInput" class="settingField" type="text" inputmode="numeric" title="Minutes per period, alternating work and break. Start with 0 to begin on a break.">
            </label>
            <label class="setting">
                <span class="settingTitle">Fields:</span>
                <input id="fieldsInput" class="settingField" type="text" title="Field titles and how many of twelve columns each takes, such as Notes:12, Blockers:6">
            </label>
        </div>
        <hr>
        <div id="rows"></div>
        <div class="dayTotal" title="Worked / Break">
            <span id="workedTotal"></span> / <span id="breakTotal" class="breakTotal"></span>
        </div>
        <div id="fields"></div>
        <div id="pomodoroDisplay" class="pomodoroDisplay" hidden>Click to activate pomodoro timer.</div>
        <label id="fieldTemplate" hidden>
            <span class="fieldTitle"></span>
            <textarea class="fieldNotes" rows="1"></textarea>
        </label>
        <div id="rowTemplate" hidden>
            <input class="start time flex_thin" type="time" title="Start Time">
            <input class="stop time flex_thin" type="time" title="Stop Time">
            <textarea class="notes flex_fat" title="Notes" rows="1"></textarea>
            <button class="remove flex_thin" title="Delete Row">X</button>
        </div>
    </body>
</html>
